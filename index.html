<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Mercedes S-Class Hub — сообщества владельцев Mercedes-Benz S-Class W223 и W224." />
  <title>Mercedes S-Class Hub</title>
  <!-- Trigger deployment -->

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23000'/%3E%3Cg fill='none' stroke='%23c8ccd0' stroke-width='3'%3E%3Ccircle cx='32' cy='32' r='23'/%3E%3Cpath d='M32 32V9M32 32L12 44M32 32l20 12'/%3E%3C/g%3E%3C/svg%3E" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <!-- ===== Шапка ===== -->
    <header class="header">
      <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Mercedes-Benz">
        <defs>
          <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#ffffff" />
            <stop offset="55%" stop-color="#b9bec4" />
            <stop offset="100%" stop-color="#6d7278" />
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#silver)" stroke-width="2.4" stroke-linecap="round">
          <circle cx="32" cy="32" r="27" />
          <path d="M32 32V7 M32 32 11.35 43.9 M32 32l20.65 11.9" />
        </g>
      </svg>

      <h1 class="title">Mercedes S-Class Hub</h1>
      <p class="subtitle">Выберите поколение вашего автомобиля</p>
    </header>

    <!-- ===== Карточки сообществ ===== -->
    <section class="cards">

      <article class="card">
        <h2 class="card__title"><span class="card__emoji">🚘</span>Mercedes S-Class W223</h2>
        <p class="card__text">Сообщество владельцев Mercedes-Benz S-Class W223</p>
        <button class="button" type="button" data-link="https://t.me/mercedesw223clubs">
          Перейти в группу
        </button>
      </article>

      <article class="card">
        <h2 class="card__title"><span class="card__emoji">🚘</span>Mercedes S-Class W224</h2>
        <p class="card__text">Сообщество владельцев Mercedes-Benz S-Class W224</p>
        <button class="button" type="button" data-link="https://t.me/mercedesw224club">
          Перейти в группу
        </button>
      </article>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
